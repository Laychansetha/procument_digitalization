name: ibis_rice_field_app
description: "IBIS RICE Field Data Collection Application (Offline-First Android App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Offline SQLite Database & Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  
  # HTTP API Communication & Networking
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  
  # Hardware: Camera, Image Picker & Signature
  image_picker: ^1.0.7
  signature: ^5.4.1
  
  # Hardware: Bluetooth ESC/POS Thermal Printing
  blue_thermal_printer: ^1.2.3
  
  # Date formatting & utilities
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
