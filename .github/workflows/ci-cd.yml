name: 🚀 IBIS RICE — CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel any superseded CI run on the same branch/PR (never cancel an active production deploy)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Web App CI — Prisma Validation, TypeCheck, ESLint & Production Build
  # Runs on every Pull Request and every push to main.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-web:
    name: ✅ Web App CI (TypeCheck, Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install locked dependencies (npm ci)
        run: npm ci

      - name: 🗄️ Validate Prisma schema & generate client
        env:
          DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?schema=public"
        run: |
          npx prisma validate
          npx prisma generate

      - name: 🔎 TypeScript type-check
        run: npm run typecheck

      - name: 🧹 ESLint
        run: npx eslint src/ --quiet

      - name: 🏗️ Next.js production build
        env:
          DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?schema=public"
          NEXTAUTH_SECRET: "ci-dummy-secret-not-used-in-production"
          NEXTAUTH_URL: "https://procurement.icsserver.com"
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Field App CI — Flutter Static Analysis & Unit/Widget Tests
  # Runs on every Pull Request and every push to main.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-field-app:
    name: 📱 Field App CI (Flutter Analyze & Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: field_app

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Install Flutter packages
        run: flutter pub get

      - name: 🔍 Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Flutter unit & widget tests
        run: flutter test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Production Deploy — Amazon Lightsail VPS
  # Runs ONLY on main (after both CI jobs pass) AND waits for 1-click manual
  # approval configured in GitHub Settings → Environments → production.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Lightsail Production
    runs-on: ubuntu-latest
    needs: [ci-web, ci-field-app]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: production
      url: https://procurement.icsserver.com

    steps:
      - name: 🔐 Verify deployment secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_APP_DIR" ] || [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing one or more required GitHub Secrets in the 'production' environment (VPS_HOST, VPS_USER, VPS_APP_DIR, VPS_SSH_PRIVATE_KEY)."
            exit 1
          fi

      - name: 🔑 Install SSH deploy key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: 📡 Add Lightsail VPS to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: 🚀 Execute safe production deploy script on Lightsail
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_APP_DIR }}' && git fetch origin main && git checkout origin/main -- scripts/deploy.sh && chmod +x scripts/deploy.sh && APP_DIR='${{ secrets.VPS_APP_DIR }}' bash '${{ secrets.VPS_APP_DIR }}/scripts/deploy.sh'"
