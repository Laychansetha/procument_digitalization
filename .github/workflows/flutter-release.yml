name: 📱 IBIS RICE — Flutter APK Release

# ─────────────────────────────────────────────────────────────────────────────
# WHEN DOES THIS RUN?
#
# Option A — Tag push:  git tag v1.2.0 && git push origin v1.2.0
#   → Builds the APK and creates a GitHub Release with the APK attached.
#
# Option B — Manual trigger: Go to GitHub → Actions → "Flutter APK Release"
#   → Click "Run workflow" → Choose branch → Click the green button.
#
# This does NOT run on every push to main (that would waste 5–8 min per push).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*" # e.g. v1.0.0, v1.2.3

  workflow_dispatch: # allows manual trigger from GitHub Actions UI
    inputs:
      version_note:
        description: "Optional note for this build (e.g. 'Hotfix for sync bug')"
        required: false
        default: "Manual build"

jobs:
  build-flutter-apk:
    name: 📱 Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Flutter requires Java 17 to build Android APKs
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Install the Flutter SDK (stable channel)
      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true # cache the Flutter SDK between runs to save time

      - name: 📦 Install Flutter dependencies
        working-directory: field_app
        run: flutter pub get

      # Analyze Dart code for warnings/errors before building
      - name: 🔎 Dart analyze
        working-directory: field_app
        run: flutter analyze --no-fatal-infos

      # Build the release APK
      - name: 🏗️ Build Release APK
        working-directory: field_app
        run: flutter build apk --release --split-per-abi

      # Rename APK files to include the version tag or commit SHA for traceability
      - name: 🏷️ Rename APK files
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="manual-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          mkdir -p apk_artifacts
          cp field_app/build/app/outputs/apk/release/*.apk apk_artifacts/
          for f in apk_artifacts/*.apk; do
            mv "$f" "${f%.apk}-${VERSION}.apk"
          done
          echo "APK files:"
          ls -la apk_artifacts/

      # Upload APK as a downloadable artifact in the Actions run
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibis-rice-field-app-${{ github.ref_name }}
          path: apk_artifacts/*.apk
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release (only when triggered by a version tag, not manually)
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-flutter-apk
    if: startsWith(github.ref, 'refs/tags/v') # only for tag pushes

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ibis-rice-field-app-${{ github.ref_name }}
          path: apk_artifacts/

      - name: 🎉 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "IBIS RICE Field App ${{ github.ref_name }}"
          body: |
            ## 📱 IBIS RICE Android Field App — ${{ github.ref_name }}

            ### What's included
            - Release APK (split by ABI for optimal download size)
            - Built from commit: `${{ github.sha }}`

            ### Installation
            1. Download the APK for your tablet architecture (usually `arm64-v8a`)
            2. Copy to Android tablet via USB or Google Drive
            3. Tap the file to install — enable "Install from unknown sources" if prompted

            ### Architecture variants
            | File | Target Device |
            |------|--------------|
            | `*-arm64-v8a-*` | Modern Android tablets (recommended) |
            | `*-armeabi-v7a-*` | Older 32-bit Android devices |
            | `*-x86_64-*` | Android emulators (for testing) |
          files: apk_artifacts/*.apk
          draft: false
          prerelease: false
