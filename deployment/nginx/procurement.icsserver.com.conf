# =============================================================================
# Nginx Reverse Proxy Configuration for procurement.icsserver.com
# Target Platform: Amazon Linux 2023 / RHEL on Amazon Lightsail VPS
# Path on Server: /etc/nginx/conf.d/procurement.icsserver.com.conf
# =============================================================================

# ── 1. Existing Application: ICS Server (Survey Solutions) ────────────────────
server {
    listen 80;
    server_name icsserver.com www.icsserver.com;

    # Allow large questionnaire data & file uploads for Survey Solutions
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# ── 2. New Application: IBIS Rice Procurement System ─────────────────────────
server {
    listen 80;
    server_name procurement.icsserver.com;

    # Passbook photos, bank documents, scale receipts & truck photos
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
